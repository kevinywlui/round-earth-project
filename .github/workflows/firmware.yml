name: Firmware CI

on:
  push:
    branches: [main]
    paths:
      - 'bike-speedometer/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'bike-speedometer/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Compile the sketch for the real target board so a typo or a missing
      # symbol fails CI instead of shipping to a device that's hard to reflash.
      # BLEDevice/BLE2902/esp_task_wdt all ship with the ESP32 Arduino core, so
      # no extra libraries are needed.
      - name: Compile speed.ino for XIAO ESP32-C6
        uses: arduino/compile-sketches@v1
        with:
          fqbn: 'esp32:esp32:XIAO_ESP32C6'
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - bike-speedometer/speed
