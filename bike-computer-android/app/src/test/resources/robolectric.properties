# Pin a single android-all-instrumented jar project-wide so only ONE ~50MB SDK
# jar is ever fetched. SDK 34 is the highest stably-supported android-all for
# Robolectric 4.14; any sdk >= 33 executes the TIRAMISU+ writeDescriptor branch
# that Tier 2 will need, so 34 costs no branch coverage. (compileSdk is 35.)
sdk=34
